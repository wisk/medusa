version: 0.5.{build}
branches:
  only:
  - dev
  - modernize-and-fix
image: Visual Studio 2022
configuration:
- Release
- Debug
platform: x64
environment:
  VCPKG_DEFAULT_TRIPLET: x64-windows
install:
- cmd: >-
    cd C:\Tools\vcpkg

    git pull

    .\bootstrap-vcpkg.bat

    cd "%APPVEYOR_BUILD_FOLDER%"

    vcpkg install --triplet x64-windows
cache: c:\tools\vcpkg\installed\
before_build:
- cmd: >-
    md build

    cd build

    cmake -G"Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=c:/tools/vcpkg/scripts/buildsystems/vcpkg.cmake ..
build:
  project: C:\projects\medusa\build\Medusa.sln
  parallel: true
  verbosity: minimal
test_script:
- cmd: ctest -VV -C %CONFIGURATION% --timeout 30
